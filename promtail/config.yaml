server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://crypto-loki:3100/loki/api/v1/push

scrape_configs:

  # ============================
  # Kafka Producers
  # ============================
  - job_name: kafka_producers
    static_configs:
      - targets: [localhost]
        labels:
          job: kafka_producer
          service: producer
          __path__: /var/log/central_hub/producers/**/*.log

  # ============================
  # Kafka Consumers
  # ============================
  - job_name: kafka_consumers
    static_configs:
      - targets: [localhost]
        labels:
          job: kafka_consumer
          service: consumer
          __path__: /var/log/central_hub/consumers/**/*.log
