global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'producers'
    static_configs:
      - targets:
          - crypto-producer:9200

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8070']


  - job_name: 'node_exporter'
    static_configs:
      - targets: ['172.17.0.1:9100']

