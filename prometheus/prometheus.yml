global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'producers'
    static_configs:
      - targets:
          - crypto-producer:8000

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['172.19.96.1:9100']
    
