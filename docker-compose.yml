# All secrets/credentials come from .env (see .env.example).
# Healthchecks: a service is "healthy" when its check passes. Services that
# need another service wait for it with `condition: service_healthy`.
# Restart policy: everything long-running uses `unless-stopped`; the migrator
# runs once per `docker compose up` and is not restarted.

services:
  # --- THE BROKER (KRaft mode) ---
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_broker
    ports:
      - "9092:9092"  # host listener
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # Three listeners: containers use 29092, the host uses 9092, controller uses 9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - streaming-network
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    container_name: crypto-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema_registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - streaming-network
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - streaming-network
    restart: unless-stopped

  # --- THE PRODUCER (async WebSocket -> Kafka) ---
  crypto-producer:
    container_name: crypto-producer
    build:
      context: ./producers
      dockerfile: Dockerfile.producers
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9200:9200"
    environment:
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - SCHEMA_DIR=/app/schemas
      - PRODUCER_SCRIPT=main.py
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./logs:/app/logs
      - ./schemas:/app/schemas
    healthcheck:
      # Metrics endpoint is only up while the producer process is running
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - streaming-network
    restart: unless-stopped

  # --- CONSUMERS (Kafka -> Redis) ---
  orderbook-consumer:
    build: ./consumers/orderbook
    container_name: orderbook-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "nobitex.orderbook"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./consumers/shared:/app/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - streaming-network
    restart: unless-stopped

  trades-consumer:
    build:
      context: ./consumers
      dockerfile: trades/Dockerfile
    container_name: trades-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_TOPIC: "nobitex.trades"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - streaming-network
    restart: unless-stopped

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    build: ./connectors
    container_name: crypto-kafka-connect
    ports:
      - "8083:8083"
      - "9404:9404"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_PORT: 8083
      CONNECT_LISTENERS: "http://0.0.0.0:8083"
      CONNECT_REST_ADVERTISED_LISTENERS: "http://kafka-connect:8083"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

      CONNECT_GROUP_ID: "kafka-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: "connect-configs"
      CONNECT_CONFIG_STORAGE_CLEANUP_POLICY: "compact"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_OFFSET_STORAGE_CLEANUP_POLICY: "compact"
      CONNECT_OFFSET_STORAGE_TOPIC: "connect-offsets"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_STATUS_STORAGE_TOPIC: "connect-status"
      CONNECT_STATUS_STORAGE_CLEANUP_POLICY: "compact"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx_prometheus_javaagent.jar=9404:/etc/jmx-exporter/config.yml

      # Where Kafka Connect looks for plugins (e.g. the Redis sink)
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    volumes:
      - kafka-connect-data:/var/lib/kafka/data
      - ./monitoring/jmx-config.yml:/etc/jmx-exporter/config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - streaming-network
    restart: unless-stopped

  # --- CLICKHOUSE (long-term analytics store) ---
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: crypto-clickhouse
    ports:
      - "8123:8123"  # HTTP interface (Grafana)
      - "9000:9000"  # native TCP
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-crypto_db}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse_admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - streaming-network
    restart: unless-stopped

  # Runs the ClickHouse migrations once on every `docker compose up`, as soon as
  # ClickHouse and Kafka are healthy, then exits. The SQL uses IF NOT EXISTS,
  # so running it again is safe.
  migrator:
    build: ./migrator
    container_name: migrator
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-crypto_db}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-clickhouse_admin}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    networks:
      - streaming-network
    restart: "no"

  # --- MONITORING ---
  prometheus:
    image: prom/prometheus
    container_name: crypto-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    pid: host
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    ports:
      - "8070:8070"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--port=8070'
      - '--listen_ip=0.0.0.0'
      - '-docker_only=true'
      - '-housekeeping_interval=10s'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8070/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - streaming-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: crypto-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    depends_on:
      clickhouse:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - streaming-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: crypto-lokidok
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - streaming-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.8.2
    container_name: crypto-promtail
    volumes:
      - ./logs:/var/log/central_hub:ro
      - ./promtail:/etc/promtail
    command: -config.file=/etc/promtail/config.yaml
    user: "root"
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      # promtail image has no curl/wget, so just check that its HTTP port (9080) accepts connections
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - streaming-network
    restart: unless-stopped

volumes:
  kafka_data:
  clickhouse_data:
  grafana_data:
  loki-data:
  kafka-connect-data:

networks:
  streaming-network:
    driver: bridge
